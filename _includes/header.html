<header class="site-header" role="banner">

  <div class="wrapper">
    {%- assign default_paths = site.pages | map: "path" -%}
    {%- assign page_paths = site.header_pages | default: default_paths -%}
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
      <img src="{{ "/assets/sample_lamp-cropped.svg" | relative_url }}">
      {{ site.title | escape }}
    </a>

    {%- if page_paths -%}
      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger" class="nav-trigger--label">
          <img class="menu-icon" src="{{ "/assets/menu-icon.svg" | relative_url }}">
          <img class="close-icon" src="{{ "/assets/close-icon.svg" |relative_url }}">
        </label>

        <div class="trigger">
            <a class="page-link" href="/about">About</a>
        </div>
        <div class="trigger">
            <a class="page-link" href="/contact">Contact</a>
        </div>
      </nav>
    {%- endif -%}
  </div>
</header>
